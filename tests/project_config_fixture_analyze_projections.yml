models:
- NOAA-GFDL/GFDL-ESM4
- INM/INM-CM4-8
- INM/INM-CM5-0
scenarios: [ssp245, ssp585]
variables: [precip, temp]
variable_options:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}
ensemble: cmip6
projections_catalog: config/catalogs/cmip6_data.yml

reference_period:
  start: 1990
  end: 2010
future_periods:
  far: {start: 2070, end: 2090}
members:
  preference:
  - r1i1p1f1

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The shape of a run · BlueEarth CST</title>
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:#bfc0c0; --accent:#eb6c36; --tint:#fcebe3; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,"Segoe UI",Arial,sans-serif; }
    main { max-width:1120px; margin:auto; padding:12px 0 0; }
    .eyebrow, .tag, .detail-label { font:600 11px/1.4 "Geist Mono",Consolas,monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
    h1 { margin:7px 0 8px; font:400 clamp(30px,4vw,46px)/1.08 "Instrument Serif",Georgia,serif; }
    .intro { margin:0 0 22px; max-width:760px; color:var(--muted); line-height:1.5; }
    .diagram-scroll { overflow-x:auto; }
    svg { display:block; width:100%; height:auto; overflow:visible; }
    .node { cursor:pointer; outline:none; }
    .node rect { fill:white; stroke:var(--ink); stroke-width:1.5; transition:fill .15s,stroke-width .15s; }
    .node.optional rect, .node.overlay rect { fill:#f0f1f3; stroke:var(--soft); }
    .node.simulation rect { fill:var(--tint); stroke:var(--accent); stroke-width:2; }
    .node:hover rect, .node:focus-visible rect, .node.selected rect { stroke-width:3; }
    .node:focus-visible { filter:drop-shadow(0 0 3px var(--accent)); }
    .node text { pointer-events:none; }
    .name { fill:var(--ink); font:600 17px Geist,"Segoe UI",Arial,sans-serif; }
    .small { fill:var(--muted); font:12px "Geist Mono",Consolas,monospace; }
    .number { fill:var(--soft); font:600 11px "Geist Mono",Consolas,monospace; letter-spacing:.1em; }
    .connector { fill:none; stroke:var(--muted); stroke-width:2; stroke-dasharray:5 4; marker-end:url(#arrow); }
    .guide { stroke:var(--rule); stroke-width:1; }
    .caption { fill:var(--soft); font:11px "Geist Mono",Consolas,monospace; letter-spacing:.09em; }
    .details { border-top:1px solid var(--rule); padding-top:19px; min-height:125px; max-width:780px; }
    .details h2 { font:600 19px Geist,"Segoe UI",Arial,sans-serif; margin:7px 0; }
    .details p { color:var(--muted); line-height:1.5; margin:0; }
    @media (max-width:650px) { main { padding-top:8px; } svg { min-width:900px; } }
  </style>
</head>
<body>
<main>
  <div class="diagram-scroll">
  <svg viewBox="0 0 1000 320" role="img" aria-labelledby="chart-title chart-desc">
    <title id="chart-title">Execution order of the five BlueEarth CST workflows</title>
    <desc id="chart-desc">The runner executes analyze_climate, build_model, analyze_projections, generate_scenarios, then simulate_system. Dashed arrows show order, not data dependencies. Analyze_climate is optional; build_model and generate_scenarios supply inputs required by simulate_system.</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker></defs>
    <text class="caption" x="20" y="35">ALL-WORKFLOW RUNNER · EXECUTION ORDER</text>
    <line class="guide" x1="20" y1="48" x2="980" y2="48"/>
    <path class="connector" d="M 196 133 H 213"/>
    <path class="connector" d="M 392 133 H 409"/>
    <path class="connector" d="M 588 133 H 605"/>
    <path class="connector" d="M 784 133 H 801"/>
    <g class="node optional" data-id="wf0" tabindex="0" role="button" aria-label="analyze_climate, optional" aria-pressed="false">
      <rect x="20" y="76" width="176" height="114" rx="6"/>
      <text class="number" x="32" y="98">WF0 · OPTIONAL</text><text class="name" x="32" y="127">analyze_climate</text><text class="small" x="32" y="158">Historical climate</text>
    </g>
    <g class="node" data-id="wf1" tabindex="0" role="button" aria-label="build_model" aria-pressed="false">
      <rect x="216" y="76" width="176" height="114" rx="6"/>
      <text class="number" x="228" y="98">WF1 · MODEL</text><text class="name" x="228" y="127">build_model</text><text class="small" x="228" y="158">Wflow-SBM</text>
    </g>
    <g class="node overlay" data-id="wf2" tabindex="0" role="button" aria-label="analyze_projections" aria-pressed="false">
      <rect x="412" y="76" width="176" height="114" rx="6"/>
      <text class="number" x="424" y="98">WF2 · OVERLAY</text><text class="name" x="424" y="127">analyze_projections</text><text class="small" x="424" y="158">CMIP6 plausibility</text>
    </g>
    <g class="node" data-id="wf3" tabindex="0" role="button" aria-label="generate_scenarios" aria-pressed="false">
      <rect x="608" y="76" width="176" height="114" rx="6"/>
      <text class="number" x="620" y="98">WF3 · SCENARIOS</text><text class="name" x="620" y="127">generate_scenarios</text><text class="small" x="620" y="158">Climate collection</text>
    </g>
    <g class="node simulation" data-id="wf4" tabindex="0" role="button" aria-label="simulate_system" aria-pressed="false">
      <rect x="804" y="76" width="176" height="114" rx="6"/>
      <text class="number" x="816" y="98">WF4 · STRESS TEST</text><text class="name" x="816" y="127">simulate_system</text><text class="small" x="816" y="158">Responses + indicators</text>
    </g>
    <text class="caption" x="20" y="234">DASHED ARROWS = RUN ORDER, NOT DATA DEPENDENCIES</text>
    <text class="caption" x="20" y="261">WF1 + WF3 SUPPLY THE REQUIRED INPUTS TO WF4 · WF2 ONLY OVERLAYS PLAUSIBILITY</text>
    <text class="caption" x="20" y="288">WF0 IS OPTIONAL AND RUNS ALONE WHEN CHOOSING FORCING</text>
  </svg>
  </div>
  <section class="details" aria-live="polite" aria-atomic="true">
    <div class="detail-label" id="detail-label">How to explore</div>
    <h2 id="detail-title">Select a workflow</h2>
    <p id="detail-text">The dashed arrows show execution order. Simulation requires the model from WF1 and the scenario collection from WF3. WF2 is a plausibility overlay and does not generate scenarios.</p>
  </section>
</main>
<script>
  const details = {
    wf0: ["WF0 · Optional", "analyze_climate", "Characterizes historical climate without a model. Run it on its own when choosing the climate forcing for the model."],
    wf1: ["WF1 · Model", "build_model", "Builds the basin model and runs it on historical forcing. The model is a prerequisite for scenario simulation."],
    wf2: ["WF2 · Plausibility overlay", "analyze_projections", "Provides CMIP6 change factors to judge which tested climate changes are plausible. It does not determine the scenarios to simulate."],
    wf3: ["WF3 · Scenarios", "generate_scenarios", "Creates the climate scenario collection independently of the model. These scenarios are a prerequisite for simulation."],
    wf4: ["WF4 · Stress test", "simulate_system", "Consumes the model and generated scenarios, then reduces simulated responses into indicators."]
  };
  const nodes = [...document.querySelectorAll('.node')];
  function select(node) {
    nodes.forEach(n => { n.classList.toggle('selected', n === node); n.setAttribute('aria-pressed', String(n === node)); });
    const [label, title, body] = details[node.dataset.id];
    document.getElementById('detail-label').textContent = label;
    document.getElementById('detail-title').textContent = title;
    document.getElementById('detail-text').textContent = body;
  }
  nodes.forEach(node => {
    node.addEventListener('click', () => select(node));
    node.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(node); }
    });
  });
</script>
</body>
</html>

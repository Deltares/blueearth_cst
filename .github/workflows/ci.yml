# CI — runs the unit suite on both supported pixi platforms.
#
# Scope: only tests that pass on a BARE CHECKOUT run here. Expected skips are
# the tests that need the untracked `test_case/test_local` fixture tree and the
# end-to-end workflow test behind the `--run-integration` opt-in flag
# (tests/conftest.py; `pixi run test-e2e`). Nothing else in the suite invokes
# Rscript or Julia, so CI does NOT run `pixi run install` (weathergenr + the
# Julia env): Julia is juliaup-managed and absent from pixi by design (AGENTS.md
# Hard Constraints), and weathergenr is only needed at Snakemake runtime.
#
# Gates that CANNOT run here and remain local-only: `check_baseline.py` and
# `semantic_tree_diff.py` as whole-tree gates (both need the untracked fixture),
# and any real workflow execution (needs the Deltares catalog and CMIP6 GCS
# access). `semantic_tree_diff`'s own unit tests DO run.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Supersede an in-flight run when the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # faulthandler_timeout dumps every thread's traceback when one test runs
      # longer than 15 min (it does not fail the test), so a hung worker names
      # its test before the job timeout cancels the run.
      PYTEST_ADDOPTS: -n 2 --dist loadfile -o faulthandler_timeout=900
    strategy:
      # Both legs always report: a failure on one platform must not mask the
      # other's result. The platforms fail differently (Windows owns the
      # cp1252/CRLF/file-locking class of defect).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.70.2
          # Set explicitly because it is load-bearing: the run fails if pixi.lock
          # has drifted from pixi.toml, so lock drift surfaces here rather than
          # on someone's next `pixi install`.
          locked: true
          cache: true

      - name: Lint (ruff)
        # Runs before the suite for fast feedback, on both legs so the lint
        # never silently disappears when the matrix is edited.
        #
        # The rule set is pinned in pyproject.toml [tool.ruff.lint] and must stay
        # pinned: ruff's default selection is far broader and grows across
        # releases, so an unpinned `select` would turn a routine ruff upgrade
        # into a red CI on an untouched tree.
        run: pixi run ruff check .

      - name: Format (ruff)
        # Scope and exclusions (Markdown and the vendored dev/scripts/console.py)
        # live in pyproject.toml [tool.ruff.format]; keep them there, not here,
        # so a local `pixi run format-check` and CI cannot disagree.
        run: pixi run format-check

      - name: Run the unit suite
        # -rs prints every skip reason, so the expected-skip set stays visible in
        # the log rather than silently drifting. A new skip is a signal.
        #
        # The one expected difference between the legs is
        # tests/test_snake_utils.py::test_patch_psutil_exposes_pss, which covers
        # a Windows-only psutil shim and skips itself off win32. Any other
        # divergence between the two legs is worth investigating.
        run: pixi run pytest tests/ -q -rs

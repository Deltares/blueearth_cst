# =============================================================================
#  BASELINE -- the worked example, and the seed the baseline is recorded from
# =============================================================================
#
# `dev/baseline/manifest.json` is recorded from this set and nothing else.
# Use it for a milestone seal or any run whose numbers you will read; use
# `project_config_rapid.yml` for everything else.
#
# Paths resolve beside their declaring YAML; toolbox: names bundled resources.

schema_version: 3


# -----------------------------------------------------------------------------
#  PROJECT
# -----------------------------------------------------------------------------

project:
  project_dir: test_local
  catalog: toolbox:config/catalogs/deltares_data_pdrive.yml


# -----------------------------------------------------------------------------
#  BASIN
# -----------------------------------------------------------------------------

basin:
  region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
  resolution: 0.00833
  output_locations: test_data/output_locations.csv
  sources:
    rivers: hydro_rivers_lin
    lulc: globcover
  delineation:
    max_subbasins: 11


# -----------------------------------------------------------------------------
#  CLIMATE
# -----------------------------------------------------------------------------

climate:
  sources:
  - era5
  selected: era5
  # 17 years: one more than the 16-year minimum.
  window:
    start: 2000
    end: 2016


# -----------------------------------------------------------------------------
#  MODEL
# -----------------------------------------------------------------------------

model:
  outvars: ["river discharge", "groundwater recharge"]


# -----------------------------------------------------------------------------
#  WORKFLOWS
# -----------------------------------------------------------------------------

workflows:
  analyze_climate:
    enabled: true
  build_model:
    enabled: true
    config_path: project_config_baseline_build_model.yml
  analyze_projections:
    enabled: true
    config_path: project_config_baseline_analyze_projections.yml
  generate_scenarios:
    enabled: true
    config_path: project_config_baseline_generate_scenarios.yml
  simulate_system:
    enabled: true
    config_path: project_config_baseline_simulate_system.yml

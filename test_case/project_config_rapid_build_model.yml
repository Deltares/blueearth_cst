# build_model (wf1) -- rapid set

plotting:
  input_maps: true
  forcing_figures: false
  scales: [basin]

hydromt:
  build_config_path: toolbox:config/defaults/wflow_build_model.yml
  waterbodies_config_path: toolbox:config/defaults/wflow_update_waterbodies.yml

# Model run period, inside `climate.window`. Shorter than the record to keep
# the run quick; the record itself must stay at 16 years or more.
run_period:
  start: 2010
  end: 2016

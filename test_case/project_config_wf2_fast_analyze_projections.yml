# analyze_projections (wf2) -- wf2_fast set

catalog: toolbox:config/catalogs/cmip6_data.yml
ensemble: cmip6

# One model, one scenario.
models:
- NOAA-GFDL/GFDL-ESM4
scenarios: [ssp245]
members:
  preference:
  - r1i1p1f1

variables:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}

reference_window:
  start: 1990
  end: 2010
future_windows:
- start: 2070
  end: 2090
  name: far

# Config for dev/scripts/stage_cmip6.py — stage CMIP6 slices for one region,
# outside any project, as files WF2 will accept as its own raw/ cache.
#
# The slices are keyed on the REGION POLYGON, not on a bbox: the digest covers
# it, so this must be the same region.geojson the project uses or the project
# will re-fetch rather than reuse. A project writes its own at
# <project_dir>/data/spatial/geoms/region.geojson.

# The polygon the store is clipped to, plus `buffer_degrees` around its bounds.
region: test_case/test_local/data/spatial/geoms/region.geojson

# Where the slices land. Anywhere you like — outside the repo is the point.
target_root: C:/data/cmip6_slices

# Degrees added around the region bounds before reading. MUST match the
# pipeline's REGION_BUFFER_DEGREES (analyze_projections.smk:402) for the digest
# to agree; it is a digest component, not a convenience.
buffer_degrees: 1.0

# The generated catalog and its store index. Both are crawl products and carry
# an equal `crawled_on`; never hand-edit either. Defaults point at the repo's
# own copies, so these two lines are only needed to override them.
# catalog: config/catalogs/cmip6_data.yml
# store_index: config/catalogs/cmip6_store_index.json
# clim_project: cmip6

# What to stage. The cross product of these three is the slice list; a
# (model, scenario, member) the catalog does not carry is reported and skipped
# rather than ending the run.
models:
  - NOAA-GFDL/GFDL-ESM4
  - INM/INM-CM4-8
scenarios:
  - historical
  - ssp245
# One list, applied to every model — and many models do not carry r1i1p1f1.
# 70 of the catalog's 289 entries do not: UKESM1-0-LL, for instance, publishes
# the f2 forcing variant from realisation 13 (r13i1p1f2). Those combinations are
# refused up front, naming what the entry does have, rather than failing deep
# inside hydromt with a message about a local path that does not exist.
members:
  - r1i1p1f1

# SOURCE variable names, as the catalog spells them, with the units the STORED
# values are in. The units are stamped on the slice after the catalog adapter
# converts — they label the values, they do not change them, and they are not a
# digest component (S8-08(a)).
# These are the names AFTER the catalog's rename -- what the slice's data_vars
# are actually called, and what the config's `variables.*.source` values say.
# NOT the raw CMIP6 names (pr/tas): the catalog renames on read, and the digest
# carries the post-rename names, so `pr` here would not match the pipeline.
variables:
  precip:
    units: kg m-2 s-1
  temp:
    units: K

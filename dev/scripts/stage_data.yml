# Config for dev/scripts/stage_data.py
#
# Stages a bbox-clipped subset of a remote data root onto a local path,
# mirroring the directory tree so an existing data catalog can simply have
# its `meta.root` swapped to point at the local copy.

source_root: P:/wflow_global/hydromt
target_root: C:/data/wflow_global/hydromt

# west, south, east, north (lon/lat).  Pad generously around the basin of
# interest so small region tweaks do not require re-staging.
bbox: [8.5, -0.5, 11.0, 1.5]

# Each dataset entry has:
#   name : friendly label used in logs
#   type : raster | raster_glob | vector | zarr | netcdf | netcdf_glob
#   path : path relative to source_root (mirrored under target_root)
#   pattern : glob, for raster_glob (default "*.tif") / netcdf_glob (default "*.nc")
#   workers : optional parallel file workers for *_glob (default: 4 for >5 files)
#   columns : optional vector columns to read/write for type=vector
#   time_range : optional [start, end] date clip for zarr | netcdf | netcdf_glob
#   variables : optional NATIVE var names to keep for zarr | netcdf | netcdf_glob
#                (filtered BEFORE hydromt applies its rename -> use source names)
#
# netcdf_glob stages a directory of per-file netcdfs (one clipped .nc per source
# file, mirrored) — for meteo sources whose catalog URI templates a {year}
# (CHIRPS) or {variable} (E-OBS) axis, which the single-file netcdf type can't open.
# Incremental: expanding a request reuses what is already staged. netcdf_glob
# WIDENING only stages the newly-in-range files (per-file manifests track each
# source file's natural span). Single-store zarr / netcdf REBUILD in place —
# widening the time_range (incl. a prepend) or adding a variable reuses the
# local store and reads only the missing pieces from the source, value-identical
# to a from-scratch stage. Only a bbox change forces a full re-read.
#
# Performance: staging cost is dominated by TIME_RANGE, not bbox. Sources are
# stored in coarse spatial chunks (era5 zarr ~250x480, CHIRPS ~320x300 cells),
# so a small bbox still reads whole spatial chunks — tightening time_range is the
# effective lever. netcdf_glob `workers>1` gives little speed-up (the netCDF-C
# library serializes concurrent reads); it mainly helps raster_glob.
datasets:
  - name: vito
    type: raster
    path: landuse/vito/ProbaV_LC100_epoch2015_global_v2.0.2_discrete-classification_EPSG-4326.tif

  - name: merit_hydro_ihu
    type: raster_glob
    path: topography/merit_hydro_ihu/30sec
    pattern: "*.tif"

  - name: modis_lai
    type: raster_glob
    path: landuse/modis/MODIS_MCD15A3H_LAI
    pattern: "*.tif"

  - name: soilgrids
    type: raster_glob
    path: soil/soilgrids_v1.0
    pattern: "*.tif"

  - name: basin_index
    type: vector
    path: topography/merit_hydro/basin_index.gpkg

  - name: rivers_lin2019
    type: vector
    path: hydrography/rivers_lin2019/rivers_ge30m.gpkg

  # --- Meteo / climate forcing sources ---------------------------------------
  # Source coverage + native->wflow variable names are noted per dataset. wflow
  # historical forcing here is `clim_historical: era5` with `variables:
  # [precip, temp]` over 2000-2020 (see config/workflows/snake_config_*.yml);
  # CHIRPS/E-OBS are staged as alternative forcing sources for the same window.

  - name: era5_daily
    type: zarr
    path: meteo/era5_daily.zarr
    # Coverage: daily, ~1950 -> present (the full "~73-year" zarr). The wflow
    # forcing build only uses 2000-2020 (see snake config); limiting the time
    # slice avoids streaming the whole zarr over SMB.
    time_range: ["1970-01-01", "2020-12-31"]
    # `variables:` takes the zarr's NATIVE ERA5 short names (filtered BEFORE
    # hydromt applies its rename). native -> wflow (deltares_data.yml `era5`):
    #   tp -> precip   t2m -> temp   tmin -> temp_min   tmax -> temp_max
    #   msl -> press_msl   ssrd -> kin   tisr -> kout
    # wflow forcing here needs precip + temp; the rest are optional PET inputs.
    #variables: [tp, t2m, tmin, tmax]

  - name: chirps_africa_daily_v2.0   # precip-only (catalog default `chirps`)
    type: netcdf_glob
    path: meteo/chirps_africa_daily_v2.0
    pattern: "CHIRPS_rainfall_*.nc"
    # Coverage: daily, per-year files 1981 -> 2023.
    # native -> wflow (deltares_data.yml `chirps`): precipitation -> precip
    # NOTE: CHIRPS carries precipitation ONLY (no temperature), so it cannot be
    # a standalone wflow forcing source — pair it with temp from era5/E-OBS.
    time_range: ["1990-01-01", "2020-12-31"]
    #variables: [precipitation]   # native source name (single var; optional)

  # E-OBS stores each variable as its own single file under an upper-case subdir
  # (RR, TG, ...). One entry per variable; both mirror to `meteo/eobs/<VAR>/...`
  # so the catalog glob `meteo/eobs/*/{variable}_..._v22.0e.nc` resolves locally.
  # DOMAIN: Europe only (~25-72°N, 25°W-45°E) — these entries cleanly SKIP
  # ("no overlap") for non-European bboxes such as the current African test basin.
  # Coverage (v22.0e): daily, 1950-01-01 -> 2020-06-30 (series ends mid-2020).
  # native -> wflow (deltares_data.yml `eobs`): rr -> precip, tg -> temp,
  #   pp -> press_msl, qq -> kin  (tn/tx/hu/fg exist but are not renamed).
  - name: eobs_rr_v22.0e            # precip (rr)
    type: netcdf
    path: meteo/eobs/RR/rr_ens_mean_0.1deg_reg_v22.0e.nc
    time_range: ["2000-01-01", "2020-06-30"]
    #variables: [rr]

  - name: eobs_tg_v22.0e            # temp (tg)
    type: netcdf
    path: meteo/eobs/TG/tg_ens_mean_0.1deg_reg_v22.0e.nc
    time_range: ["2000-01-01", "2020-06-30"]
    #variables: [tg]

  - name: era5_orography
    type: netcdf
    path: meteo/era5/meta/era5_orography_2018.nc
    # Static single-time (2018) surface geopotential; native var `z`, no time
    # axis to slice. Elevation metadata for temperature lapse correction during
    # the build (hydromt derives elevtn from z), not a forcing variable.

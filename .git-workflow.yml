# Controls the git-workflow skill's ceremony for THIS repo.
# Schema: ~/workspace/brain/artifacts/skills/git-workflow/references/configuration.md
#
#   full — branch risky/multi-session work; auto-commit verified work.  (current)
#   lite — trunk only (no feature branches); auto-commit verified work.
mode: full

# Every modifying task starts in its own branch + linked worktree; this primary
# checkout is reserved for integration. Set because several sessions routinely
# work this repo at once. Agent-honored, enforced by the launcher and the
# PreToolUse guard — skill: references/worktree-enforcement.md.
# Relaxing it has collided three times: `git log -- .git-workflow.yml`.
worktree_policy: always # concurrent | always

# Isolation branches auto-land after rebase + verification. Feature branches and
# explicitly held isolation branches still wait for a decision.
isolation_landing: auto # auto | approval

# The trunk is pushed deliberately, never as a side effect of finishing a task.
# `true` re-enables the >24h / 25-commit backup trigger.
auto_push: false # true | false

# Untracked trees the launcher COPIES (never links) into each new worktree.
# Without them the fixture-dependent tests skip and the suite reports a false
# green. Rationale: AGENTS.md, worktree section.
worktree_seed:
  - test_case/test_local          # 46 MB; named by 18 of the 25 fixture references
  - test_case/basin_map_fixture   # 248 KB; only dev/scripts/preview_basin_map.py

# Untracked agent config the launcher SYMLINKS (never copies) into each new
# worktree: it is read, not written, and one shared definition is the point.
# Without it a worktree session loses the 14 project skills and the 9 personas
# with no error — the catalog is simply smaller. Rationale: AGENTS.md, worktree
# section.
worktree_link:
  - .claude   # skills/ + agents/, symlinks into ~/workspace/brain/artifacts
  - .codex    # Codex personas (regular files, no brain fallback)
  - .agents   # runtime-neutral skills/

# Environment the launcher BUILDS in each new worktree — it can be neither
# copied nor symlinked. `.pixi/` embeds absolute paths, so a copy is subtly
# broken and a link points two checkouts at one mutable prefix. `pixi install`
# is not the whole environment: weathergenr comes from GitHub via remotes and
# the Julia env from Pkg.instantiate(), both under `pixi run install`.
# Runs after seeding and linking; a failure is reported, not fatal, and never
# unwinds an otherwise-correct worktree. Skip once with --no-provision.
# VERIFY AFTERWARDS — a missing env is gitignored and invisible to git status:
#   pixi run python dev/scripts/check_env.py --all
worktree_provision:
  - pixi install
  - pixi run install

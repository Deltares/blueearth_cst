AOIS:
  data_type: GeoDataFrame
  path: C:\git\cuhemo_cst\data\AOIS\merged_aois.geojson
  driver: vector
  crs: 4326
POIS:
  data_type: GeoDataFrame
  path: C:\git\cuhemo_cst\data\POIS\river_POIS.geojson
  driver: vector
  crs: 4326
WBS:
  data_type: GeoDataFrame
  path: C:\git\cuhemo_cst\data\AOIS\WBS.geojson
  driver: vector
  crs: 4326
globcover:
  data_type: RasterDataset
  path: p:\wflow_global\hydromt\landuse\globcover\GLOBCOVER_L4_200901_200912_V2.3.tif
  driver: raster
  driver_kwargs:
    chunks:
      x: 3600
      y: 3600
  meta:
    category: landuse
    paper_doi: 10.1594/PANGAEA.787668
    paper_ref: Arino et al (2012)
    source_license: CC-BY-3.0
    source_url: http://due.esrin.esa.int/page_globcover.php
    source_version: v2.3
  crs: 4326
globcover_mapping_default:
  data_type: DataFrame
  path: C:\git\cuhemo_cst\.pixi\envs\default\Lib\site-packages\hydromt_wflow\data\lulc\globcover_mapping.csv
  driver: csv
  driver_kwargs:
    index_col: 0
    dtype:
      landuse: int16
      Kext: float32
      N: float32
      PathFrac: float32
      RootingDepth: float32
      Sl: float32
      Swood: float32
      WaterFrac: float32
      kc: float32
      alpha_h1: int16
      h1: int16
      h2: int16
      h3_high: int16
      h3_low: int16
      h4: int16
      USLE_C: float32
      Cov_River: float32
  meta:
    category: landuse
    source_info: landuse parameters based on globcover classification (http://due.esrin.esa.int/page_globcover.php)
    source_version: 1.0
hydro_lakes:
  data_type: GeoDataFrame
  path: p:\wflow_global\hydromt\hydrography\lakes\lake-db.gpkg
  driver: vector
  rename:
    Depth_avg: Depth_avg
    Dis_avg: Dis_avg
    Hylak_id: waterbody_id
    Lake_area: Area_avg
    Pour_lat: yout
    Pour_long: xout
    Vol_total: Vol_avg
  unit_mult:
    Area_avg: 1000000.0
  meta:
    category: surface water
    notes: HydroLAKES.v10_extract
    source_author: Arjen Haag
    source_version: 1.0
  crs: 4326
hydro_reservoirs:
  data_type: GeoDataFrame
  path: p:\wflow_global\hydromt\hydrography\reservoirs\reservoir-db.gpkg
  driver: vector
  nodata: -99
  rename:
    Depth_avg: Depth_avg
    Dis_avg: Dis_avg
    G_CAP_MAX: Capacity_max
    G_CAP_MIN: Capacity_min
    G_CAP_REP: Capacity_norm
    G_DAM_HGT_: Dam_height
    Grand_id: waterbody_id
    Hylak_id: Hylak_id
    Lake_area: Area_avg
    Pour_lat: yout
    Pour_long: xout
    Vol_total: Vol_avg
  unit_mult:
    Area_avg: 1000000.0
    Capacity_max: 1000000.0
    Capacity_min: 1000000.0
    Capacity_norm: 1000000.0
    Vol_avg: 1000000.0
  meta:
    category: surface water
    notes: GRanD.v1.1_HydroLAKES.v10_JRC.2016
    source_author: Alessia Matano
    source_version: 1.0
  crs: 4326
ksathorfrac:
  data_type: RasterDataset
  path: p:\wflow_global\hydromt_wflow\catalog\soil\ksathorfrac.zarr
  driver: zarr
  driver_kwargs:
    chunks:
      lon: 2400
      lat: 2400
  meta:
    resolution: 250 metres
  crs: 4326
merit_hydro:
  data_type: RasterDataset
  path: p:\wflow_global\hydromt\topography\merit_hydro\*.vrt
  driver: raster
  driver_kwargs:
    chunks:
      x: 6000
      y: 6000
  rename:
    bas: basins
    dir: flwdir
    elv: elevtn
    slp: lndslp
    sto: strord
    upa: uparea
    upg: upgrid
    wth: rivwth
  meta:
    category: topography
    paper_doi: 10.1029/2019WR024873
    paper_ref: Yamazaki et al. (2019)
    source_license: CC-BY-NC 4.0 or ODbL 1.0
    source_url: http://hydro.iis.u-tokyo.ac.jp/~yamadai/MERIT_Hydro
    source_version: 1.0
  crs: 4326
merit_hydro_ihu:
  data_type: RasterDataset
  path: p:\wflow_global\hydromt\topography\merit_hydro_ihu\30sec\*.tif
  driver: raster
  driver_kwargs:
    chunks:
      x: 6000
      y: 6000
  rename:
    30sec_basids: basins
    30sec_flwdir: flwdir
    30sec_elevtn: elevtn
    30sec_strord: strord
    30sec_uparea: uparea
    30sec_rivlen: rivlen
    30sec_rivslp: rivslp
  meta:
    category: topography
    paper_doi: 10.5281/zenodo.5166932
    paper_ref: Eilander et al. (2020)
    source_license: ODC-By 1.0
    source_url: https://zenodo.org/record/5166932#.YVbxJ5pByUk

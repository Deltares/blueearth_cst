read_config: # read user-defined config template in build mode instead of the default
  config_fn: "./wflow_sbm.toml"

setup_basemaps:
  hydrography_fn: merit_hydro_ihu   # source hydrography data {merit_hydro, merit_hydro_1k}
  basin_index_fn: merit_hydro_index # source of basin index corresponding to hydrography_fn
  upscale_method: ihu           # upscaling method for flow direction data, by default 'ihu'
  res: 0.1

# setup_areamap:
#   area_fn: AOIS
#   col2raster: AOI

setup_rivers:
  hydrography_fn: merit_hydro_ihu   # source hydrography data, should match basemaps source
  river_geom_fn: rivers_lin2019_v1 # river source data with river width and bankfull discharge
  river_upa: 30            # minimum upstream area threshold for the river map [km2]
  slope_len: 2000          # length over which tp calculate river slope [m]
  rivdph_method: powlaw           # method to estimate depth {'powlaw', 'manning', 'gvf'}
  min_rivdph: 0.5                # minimum river depth [m]
  min_rivwth: 30               # minimum river width [m]
  smooth_len: 5000             # length over which to smooth river depth and river width [m]
  river_routing: local-inertial
  elevtn_map: dem_subgrid

setup_floodplains:
  hydrography_fn: merit_hydro
  floodplain_type: 1d
  river_upa: 30
  flood_depths: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0]
  elevtn_map: dem_subgrid

setup_lulcmaps:
  lulc_fn: globcover     # source for lulc maps: {globcover, vito, corine}

setup_reservoirs:
  reservoirs_fn: hydro_reservoirs   # source for reservoirs based on GRAND: {hydro_reservoirs}; None to skip
  min_area: 1.0                     # minimum lake area to consider [km2]
  timeseries_fn: gww                # if 'jrc' or 'gww' is used to calculate some reservoir attributes instead of the GRanD and HydroLAKES db.   

setup_laimaps:
  lai_fn: modis_lai     # source for LAI: {modis_lai}
  lulc_fn: globcover
  lulc_sampling_method: q3
#  lulc_zero_classes: [1, 2, 4, 8, 0] #vito:[80, 200, 0] #esa_worldcover: [80, 0]
  buffer: 100

setup_soilmaps:
  soil_fn: soilgrids     # source for soilmaps: {soilgrids}
  ptf_ksatver: brakensiek    # pedotransfer function to calculate hydraulic conductivity: {brakensiek, cosby}

setup_ksathorfrac:
  ksat_fn: ksathorfrac
  variable: BRT_250

setup_constant_pars:
  KsatHorFrac: 100
  Cfmax: 3.75653
  cf_soil: 0.038
  EoverR: 0.11
  InfiltCapPath: 5
  InfiltCapSoil: 600 
  MaxLeakage: 0
  rootdistpar: -500
  TT: 0
  TTI: 2
  TTM: 0
  WHC: 0.1
  G_Cfmax: 5.3
  G_SIfrac: 0.002
  G_TT: 1.3

setup_config:
  "input.lateral.subsurface.ksathorfrac.netcdf.variable.name": "ksathorfrac_BRT_250"
  "input.lateral.subsurface.ksathorfrac.scale": 2
  "input.vertical.f.netcdf.variable.name": "f_"
  "input.vertical.f.scale": 1
  "input.vertical.soilthickness.netcdf.variable.name": "SoilThickness"
  "input.vertical.soilthickness.scale": 1
  "input.vertical.soilminthickness.netcdf.variable.name": "SoilMinThickness"
  "input.vertical.soilminthickness.scale": 1
  "input.vertical.soilminthickness.offset": 0
  "input.vertical.rootingdepth.netcdf.variable.name": "RootingDepth"
  "input.vertical.rootingdepth.scale": 1.5
  "input.vertical.rootingdepth.offset": 0
  "input.lateral.river.floodplain.volume.netcdf.variable.name": "floodplain_volume"
  "input.lateral.river.floodplain.volume.scale": 2
  "input.vertical.maxleakage.netcdf.variable.name": "MaxLeakage"
  "input.vertical.maxleakage.scale": 1
  "input.vertical.maxleakage.offset": 0.3
# Quarto project for the BlueEarth CST documentation site.
#
# Rooted at docs/, not at the repository root, so the render scope is a
# directory that already holds only documentation. Design and phasing:
# dev/working/2026-08-19_quarto-docs-site/design.md
#
# PHASE 3, in progress (t2608202351b). The site publishes the landing page, the
# setup guide, the user guide and the two migration notes. The technical
# background is still gated on O-3 -- the note's 38 figures are absent from the
# repository, so its chapters would publish as numbered captions under nothing
# (t2608202351). Its GUI and platform chapters stay unpublished by ruling
# (O-1c); they remain in the repo as source.
#
# Nothing here publishes. There is deliberately no `site-url` and no deploy
# workflow: the subpath a GitHub Pages project page needs is not known until the
# repository has a home, and a wrong one breaks links only once deployed.
project:
  type: website
  output-dir: _site
  render:
    # Globs, not directories. A bare `guide/` matches nothing and renders
    # nothing -- silently, with a successful exit and a smaller site.
    - "index.qmd"
    - "guide/*.qmd"
    # Explicit, like everything else here: quarto special-cases a 404.qmd only
    # when it is rendered, and this project enumerates its render targets.
    - "404.qmd"
    # The setup guide, rendered where it already lives. These two are NOT moved
    # into a setup/ directory: ten files across pixi.toml, scripts/, dev/ and
    # README.md cite these paths, and a navbar entry does the same job for free.
    - "install.md"
    - "env_setup_notes.md"

    # Migration notes. Both tell a user how to repair a config the toolbox now
    # refuses, which is site material and not a development record -- so they
    # render even though their sibling notes under dev/ never will.
    - "migration-workflow-names.md"
    - "migration-r08-wf2.md"

    # Vendored upstream Deltares documentation. Held here so an agent can read
    # it offline; republishing it would put a second, staler copy of hydromt's
    # and wflow's own docs at a URL that looks authoritative. Link out instead.
    - "!hydromt-user-guide/"
    - "!hydromt-wflow/"
    - "!wflow-user-guide/"
    - "!hydromt-architecture.md"

    # Not in the render list at all, and left that way on purpose:
    #   notebooks/  -- their outputs are stripped by policy (commit a2596d0), so
    #                  a no-execute render publishes code with no results. The
    #                  ruling O-2(a) reverses this via a committed docs/_freeze/,
    #                  which is filed but not yet done -- t2608202351a.

website:
  title: "BlueEarth CST"
  description: "Climate stress testing for water systems — the workflow toolbox"
  favicon: _images/favicon.svg
  navbar:
    left:
      - text: "User guide"
        href: guide/quick-start.qmd
      - text: "Setup"
        href: install.md
    right:
      - icon: github
        href: https://github.com/tanerumit/blueearth_cst
        aria-label: "Source on GitHub"
  sidebar:
    style: floating
    contents:
      - section: "User guide"
        contents:
          - guide/quick-start.qmd
          - guide/configuration.qmd
          - guide/running.qmd
          - guide/outputs.qmd
      - section: "Setup"
        contents:
          - install.md
          - env_setup_notes.md
      - section: "Migration notes"
        contents:
          - migration-workflow-names.md
          - migration-r08-wf2.md
  search: true
  page-footer:
    center: "Deltares · World Bank Global Water Practice — GPL-3.0"

format:
  html:
    # One brand layer over two bootswatch bases, so the reader gets a
    # light/dark toggle and the accent colours stay the site's own. theme.scss
    # therefore must not set $body-bg or $body-color -- see its header.
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap

# The site must never execute anything during a build. A render has no
# project_dir, no CMIP6 access and no Julia, and a fresh rapid run costs ~73
# minutes. `freeze: auto` means a document is only ever executed if its stored
# output is missing or stale -- and nothing here is executable yet.
execute:
  freeze: auto

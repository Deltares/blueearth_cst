<title id="toolbox-conceptual-overview-title">Toolbox conceptual overview</title>
<desc id="toolbox-conceptual-overview-desc">A shared basin-region step feeds four processes that can each start first; the evaluated model and perturbed stochastic weather converge on hydrological simulation and indicator calculation, and projections only give context to analyst-led vulnerability mapping.</desc>

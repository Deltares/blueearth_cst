      <style>#toolbox-conceptual-overview-root { font-family: 'Segoe UI', Arial, sans-serif; }
      #toolbox-conceptual-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#toolbox-conceptual-overview-root .diagram-container { overflow-x: visible; }
}</style>

# Tool-configuration host only.
#
# This file exists so Python tooling has somewhere to declare settings. It is
# DELIBERATELY NOT a packaging manifest: there is no [build-system] and no
# [project] table, nothing is installed from it, and `blueearth_cst` remains a
# plain importable directory rather than an installed distribution.
#
# That restraint is the point. Real packaging (O-14 decision 2) would reverse a
# reviewed decision recorded in dev/r06/structural-refactor-design.md:368-376,
# so it needs a superseding record in dev/decisions/ rather than arriving as a
# side effect of wanting pytest settings. Decision 1 -- this file -- costs one
# root file, adds no dependency, and reverses no contract.
#
# Also deliberately absent: [tool.pixi]. `pixi.toml` stays the pixi manifest
# (verified: pixi still resolves pixi.toml with this file present). Migrating
# the manifest here was assessed and rejected -- it churns a 100+ line manifest
# and buys nothing.
#
# Assessment: dev/reviews/2026-07-25_post-r6-assessment.md § O-14.

[tool.pytest.ini_options]
# Where tests live, so a bare `pytest` behaves like the documented `pytest tests/`.
testpaths = ["tests"]

# Repo root on sys.path. This is the supported declarative replacement for the
# 29 `sys.path.insert(0, <repo root>)` lines in tests/ -- pytest prepends these
# before collection, so `import blueearth_cst...` resolves without each module
# re-deriving the path. The inserts remain in place for now: they are idempotent
# and harmless, and removing 29 of them is a separate, independently verifiable
# change (five further inserts point at dev/scripts/, which is not a package and
# is not shipped -- those stay regardless).
pythonpath = ["."]

# Declared here rather than registered programmatically in tests/conftest.py, so
# the marker is visible to `pytest --markers` and to anyone reading the repo
# config. conftest.py keeps the --run-integration option and the skip logic --
# only the marker's DECLARATION moves.
markers = [
    "integration: end-to-end workflow test; opt-in via --run-integration",
]

# -ra shows the reason for every non-passing outcome, skips included. CI already
# passes -rs on its run line; putting it here means a skip is equally visible
# locally, which is the point of the CI comment that "a new skip is a signal".
addopts = "-ra"

# An xfail that starts passing is a silent regression in the other direction:
# the documented bug got fixed and nobody noticed the marker is now a lie.
# strict=True was already set per-marker at
# tests/test_prepare_climate_data_catalog.py:292; this makes it the default so a
# future xfail cannot opt out by omission.
xfail_strict = true

# Keep collection out of trees that are not source: the untracked run fixture
# (renamed from examples/ in R07), the pixi env, and build scratch.
norecursedirs = [
    ".git", ".pixi", ".snakemake", "test_case", "examples",
    "docs", "dev", "*.egg-info", "__pycache__",
]


# ---------------------------------------------------------------------------
# ruff -- lint (and formatter settings; formatting is NOT yet enforced, see below)
# ---------------------------------------------------------------------------
[tool.ruff]
# Set EXPLICITLY because this file deliberately has no [project] table (see the
# header): with no `requires-python` to infer from, ruff falls back to its own
# default, and every pyupgrade-style rule keys off this value. The pin matches
# `python = ">=3.12,<3.13"` in pixi.toml -- keep the two in step.
target-version = "py312"

# Added to ruff's built-in excludes (.git, build/, dist/, ...), which do NOT
# cover these. Mirrors the pytest `norecursedirs` above, minus `dev` -- dev/scripts/
# is our code and is linted (it is where the F402 shadowing below was found).
#   docs/      vendored hydromt / hydromt-wflow / wflow guides and the user
#              notebooks. AGENTS.md forbids patching vendored upstream material,
#              so linting it could only produce findings we are not allowed to act on.
#   test_case/ untracked run fixture, not source.
extend-exclude = ["docs", "test_case", ".pixi", ".snakemake"]

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff 0.16's DEFAULT selection is ~415
# rules (verified with `ruff check --isolated`: 409 findings here, vs 96 for the
# set below) and has broadened across releases -- an unpinned `select` would make
# a routine ruff upgrade a repo-wide lint failure.
#
# This is the classic pyflakes + pycodestyle-essentials core: the rules that
# find defects rather than express taste. Deliberately NOT enabled:
#   I    (import sorting)  -- 62 files of churn, zero correctness value
#   UP   (pyupgrade)       -- style; also rewrites annotations wholesale
#   B/SIM/PERF/RUF/...     -- opinion, and the repo predates them
# Any of these can be added later as its own reviewable commit.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Snakemake `script:` modules are executed with a `snakemake` object injected
# into their globals, so a bare top-level reference is legitimate -- but 22 of
# the 23 such modules already access it via the guarded
# `if "snakemake" in globals()` idiom, which keeps them importable for unit
# tests and does not trip F821. This entry covers the one remaining holdout and
# should be DELETED, not extended, when it is converted (see dev/followups.md R7-22).
"blueearth_cst/experiment/downscale_climate_forcing.py" = ["F821"]

[tool.ruff.format]
# Settings only -- `ruff format` is NOT a gate. 118 of 262 files would be
# reformatted (~7.8k diff lines), which is a churn decision on its own merits and
# is not what "adopt a linter" bought. Recorded so that if anyone does run the
# formatter, it runs Black-compatible and consistently.
quote-style = "double"

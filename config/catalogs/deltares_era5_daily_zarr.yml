# Project-owned ERA5 override for the rapid project's existing base catalog.
#
# Load this file AFTER `deltares_data_pdrive.yml`. The complete entry is
# intentional: DataCatalog replacement is
# at source level, not a recursive YAML merge.
#
# The Zarr store ends earlier than the netCDF series. The extraction validates
# requested ERA5 dates against this metadata before reading. A request extending
# beyond it warns and reads the overlap; delivered coverage is checked afterwards.

meta:
  roots:
    - p:/wflow_global/hydromt
    - /mnt/p/wflow_global/hydromt
    - /p/wflow_global/hydromt
  name: deltares_era5_daily_zarr

era5:
  data_type: RasterDataset
  uri: meteo/era5_daily.zarr
  driver:
    name: raster_xarray
    options:
      chunks: {}
  metadata:
    category: meteo
    notes: Extracted from Copernicus Climate Data Store; resampled by Deltares to
      daily frequency using right label for time.
    paper_doi: 10.1002/qj.3803
    paper_ref: Hersbach et al. (2019)
    url: https://doi.org/10.24381/cds.bd0915c6
    license: https://cds.climate.copernicus.eu/cdsapp/#!/terms/licence-to-use-copernicus-products
    extent:
      bbox:
        West: -0.125
        South: -90.125
        East: 359.875
        North: 90.125
      time_range:
        start: "1950-01-02"
        end: "2023-02-01"
    crs: 4326
  data_adapter:
    unit_mult:
      kin: 0.000277778
      kout: 0.000277778
      ssr: 0.000277778
      press_msl: 0.01
    rename:
      d2m: temp_dew
      msl: press_msl
      ssrd: kin
      t2m: temp
      tisr: kout
      tmax: temp_max
      tmin: temp_min
      tp: precip
      u10: wind10_u
      v10: wind10_v
    unit_add:
      temp: -273.15
      temp_dew: -273.15
      temp_max: -273.15
      temp_min: -273.15

# =============================================================================
#  build_model (wf1) -- build the Wflow-SBM model, run it on the historical record
# =============================================================================
#
# Keep this next to the project file. The basin, climate record and output
# variables come from there; only the model build and its run are set here.


# Selection never changes model calculation or numerical evaluation.
# Figures this workflow renders. Input: mapping.
plotting:
  # Render basin and spatial-input maps. Options: true | false.
  spatial: true
  # Render model-grid forcing maps and time series. Options: true | false.
  forcing: false
  # Render station and individual-subbasin evaluation figures. Options: true | false.
  location: false

# Model evaluation settings. Input: mapping.
#evaluation:
# Optional observed catchment water-balance screening, independent of simulated Q.
# Requires the project file's observations.river_discharge.
# Screen the observed water balance. Options: true | false.
#  budyko: true


# -----------------------------------------------------------------------------
#  RUN PERIOD
# -----------------------------------------------------------------------------

# Required inclusive years for the Wflow run, inside `climate.window`.
# Choose this separately from the longer climate record; short runs are allowed.
# Select inclusive simulation water years. Input: years within climate.window.
simulation_window:
  # First simulation water year. Input: integer year, <= end.
  start: 2010
  # Last simulation water year. Input: integer year, >= start.
  end: 2016

# With named climate.forcings: recipes to simulate (default: [default_forcing]).
# Each runs in models/hydrology/wflow/historical/<id>/; two or more are compared
# in models/hydrology/wflow/historical/forcing_comparison/.
# Select named historical recipes. Input: list of climate.forcings names.
#historical_forcings: [era5, chirps]


# -----------------------------------------------------------------------------
#  ENGINE
# -----------------------------------------------------------------------------

# hydromt build settings. These are the defaults; point at your own copies
# to change how the model is built.
# Model construction settings. Input: mapping of configuration paths.
#engine:
# Configure initial model construction. Input: HydroMT YAML file path.
#  build_config: toolbox:config/defaults/wflow_build_model.yml
# Configure lake and reservoir updates. Input: HydroMT YAML file path.
#  waterbodies_config: toolbox:config/defaults/wflow_update_waterbodies.yml

# Optional native grids at each simulation timestep; retained in run_default/output_grid.nc.
# Output settings are independent of the simulation workflow. Omitted/null disables grids.
# Retained model output settings. Input: mapping.
output:
  # Retained scalar time series; evaluation uses these values. Input: mapping.
  csv:
    # Decimal places kept in retained CSV values. Input: integer 0–15.
    decimal_places: 5
#  netcdf_grid:
#    compressionlevel: 1
#    variables:
#      snowpack_dry_snow__leq_depth: snow
#      snowpack_liquid_water__depth: snowwater
#      river_water__volume_flow_rate: discharge

# build_model (WF1): builds Wflow-SBM and runs it on the historical record. Basin,
# climate, observations and model outputs are set in the project file.

# Inside climate.window; may be shorter than the climate record.
# Select inclusive simulation water years. Input: years within climate.window.
run_period:
  # First simulation water year. Input: integer year, <= end.
  start: 2010
  # Last simulation water year. Input: integer year, >= start.
  end: 2016

# Each set runs in models/hydrology/wflow/historical/<id>/; two or more are also
# compared in historical/forcing_comparison/. Default: [climate.default_forcing].
# Select historical forcing sets. Input: list of climate.forcings names.
#historical_forcings: [era5, chirps]

# Figure selection never changes the model or its evaluation.
# Figures this workflow renders. Input: mapping.
plotting:
  # Render basin and spatial-input maps. Options: true | false.
  input_maps: true
  # Render model-grid forcing maps and time series. Options: true | false.
  forcing_figures: false
  # basin: outlet and basin-average figures; locations adds station and subbasin figures.
  # Select spatial scales. Options: [basin] | [basin, locations].
  scales: [basin]
  # With several forcing sets, comparison draws discharge per station across runs
  # (in forcing_comparison/) instead of per run; individual and both keep both.
  # Choose how forcing runs are shown. Options: comparison | individual | both.
  #view: comparison

# Model evaluation settings. Input: mapping.
#evaluation:
  # Observed water-balance screening; needs the project's observations.river_discharge.
  # Screen the observed water balance. Options: true | false.
#  budyko: true

# HydroMT build recipes; defaults shown. Point at your own copies to change the build.
# Model construction settings. Input: mapping of configuration paths.
#hydromt:
  # Configure initial model construction. Input: HydroMT YAML file path.
#  build_config_path: toolbox:config/defaults/wflow_build_model.yml
  # Configure lake and reservoir updates. Input: HydroMT YAML file path.
#  waterbodies_config_path: toolbox:config/defaults/wflow_update_waterbodies.yml

# Optional netcdf_grid writes native grids per timestep to the run folder's
# output_grid.nc; omitted or null disables them.
# Retained model output settings. Input: mapping.
output:
  # Retained scalar time series; evaluation uses these values. Input: mapping.
  csv:
    # Decimal places kept in retained CSV values. Input: integer 0–15.
    decimal_places: 5
#  netcdf_grid:
#    compressionlevel: 1
#    variables:
#      snowpack_dry_snow__leq_depth: snow
#      snowpack_liquid_water__depth: snowwater
#      river_water__volume_flow_rate: discharge

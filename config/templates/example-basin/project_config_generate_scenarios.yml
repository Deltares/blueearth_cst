# generate_scenarios (WF3): generates weather from climate.default_forcing, perturbs
# it across a temperature x precipitation grid and publishes an immutable collection.

# Select one method; schema-3 projects support stochastic or delta_change.
# Choose the scenario producer. Options: stochastic | delta_change.
method: stochastic

# Configure scenario-neutral weather generation. Input: mapping.
stochastic:
  # A fixed integer reproduces the same scenarios anywhere. `auto` derives the
  # seed from the climate-draw settings, source data and generator code, so any
  # change to those draws new weather.
  # Control reproducibility of generated weather. Input: integer or auto.
  seed: auto

  # Generate weather realizations per grid point. Input: positive integer.
  n_realizations: 2

  # Future years to simulate, inclusive. Match an analyze_projections horizon
  # to place the projections on the same period.
  # Select inclusive scenario simulation years. Input: year mapping.
  future_period:
    # First scenario simulation year. Input: integer year, <= end.
    start: 2040
    # Last scenario simulation year. Input: integer year, >= start.
    end: 2060


  # -----------------------------------------------------------------------------
  #  PERTURBATION GRID
  # -----------------------------------------------------------------------------

  # Each axis runs from `min` to `max` in `n_levels` steps. One value applies to
  # every month; a list of 12 sets January-December. The grid is temp levels x
  # precip levels, plus one unperturbed run (st_0), always included.
  #
  # `trajectory` is required: `constant` applies the full change from the
  # start, `transient` ramps it up over the run.
  # Define scenario stressors and monthly perturbations. Input: mapping.
  climate_perturbations:
    # Define temperature perturbation axis. Input: mapping.
    temp:
      # Set temperature levels between minimum and maximum. Input: positive integer.
      n_levels: 2
      # Apply changes immediately or progressively. Options: constant | transient.
      trajectory: transient
      # Add monthly mean temperature changes. Input: minimum/maximum mappings, degrees Celsius.
      mean:
        # Lower temperature change. Input: one number or 12 (January–December), degrees Celsius.
        min: 0.0
        # Upper temperature change. Input: one number or 12 (January–December), degrees Celsius.
        max: 3.0
    # Define precipitation perturbation axis. Input: mapping.
    precip:
      # Set precipitation levels between minimum and maximum. Input: positive integer.
      n_levels: 3
      # Apply changes immediately or progressively. Options: constant | transient.
      trajectory: transient
      # Scale monthly precipitation means. Input: minimum/maximum multiplier mappings; 0.7 means 30% drier.
      mean:
        # Lower precipitation multiplier. Input: one positive number or 12 (January–December).
        min: 0.7
        # Upper precipitation multiplier. Input: one positive number or 12 (January–December).
        max: 1.3
      # Scale year-to-year precipitation variability. Input: multiplier mappings; 1.0 leaves variability unchanged.
      variance:
        # Lower variability multiplier. Input: one positive number or 12 (January–December).
        min: 1.0
        # Upper variability multiplier. Input: one positive number or 12 (January–December).
        max: 1.0

    # Dry and wet spell length multipliers, applied to every run. Not a grid axis.
    # Scale dry and wet spell lengths. Input: monthly multiplier mapping.
    #spell_factors:
      # Scale dry spell lengths. Input: one positive multiplier or 12 (January–December).
    #  dry: 1.0
      # Scale wet spell lengths. Input: one positive multiplier or 12 (January–December).
    #  wet: 1.0


  # Weather generator settings; the default is the toolbox's weathergenr file.
  # Replace the weathergenr settings. Input: YAML path relative to this file or absolute.
  #generator_config_path: toolbox:config/defaults/weathergenr_config.yml

  # Advanced namespace capacity; choose at least the run-plus-bundle count.
  # Reserve enough identifiers for scenario units. Input: positive integer covering all generated units.
  #unit_id_capacity: 10000


# Standalone input to scripts/compare_historical.py; paths resolve beside this file.
# Match project.project_dir in project_config.yml after copying/scaffolding.
project_dir: ../../runs/example-basin
runs:
  - era5_reference
  - chirps_reference
evaluation_window:
  # Inclusive daily interval-end response timestamps; unavailable dates are rejected.
  start: "2002-10-01"
  end: "2005-09-30"
# Water years use start-year labels; this orders seasonal curves October to September.
water_year_start: Oct
# Optional semicolon CSV (time;wflow_id;...), daily discharge in m3/s.
observations_path: null
# Must be new; existing comparisons are never overwritten.
output_dir: ../../runs/example-basin/comparisons/historical/forcing_comparison

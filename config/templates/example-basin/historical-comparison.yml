# Standalone input to scripts/compare_historical.py; paths resolve beside this file.
# Match project.project_dir in project_config.yml after copying/scaffolding.
project_dir: outputs
runs:
  - era5_reference
  - chirps_reference
evaluation_window:
  # First reporting year, labelled by its start year. Input: integer year.
  start: 2002
  # Last reporting year, inclusive. Input: integer year >= start.
  end: 2004
# Expands this window to 2002-10-01 through 2005-09-30; unavailable dates are rejected.
# Also orders seasonal curves October to September.
water_year_start: Oct
# Optional semicolon CSV (time;wflow_id;...), daily discharge in m3/s.
observations_path: null
# Must be new; existing comparisons are never overwritten.
output_dir: outputs/comparisons/historical/forcing_comparison

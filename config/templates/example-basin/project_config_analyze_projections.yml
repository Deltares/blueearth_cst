# analyze_projections (WF2): CMIP6 change factors that show where projections fall
# on the stress-test grid. They do not drive the stress test.


# -----------------------------------------------------------------------------
#  ENSEMBLE
# -----------------------------------------------------------------------------

# The generated CMIP6 catalog is the default.
# Locate available climate projections. Input: CMIP6 catalog YAML path.
#projections_catalog: toolbox:config/catalogs/cmip6_data.yml
# Identify the climate projection ensemble. Options: cmip6.
ensemble: cmip6

# Models as Institution/Source. The full list of 65: config/templates/README.md.
# Select climate models to compare. Input: list of catalog Institution/Source identifiers.
models: [NOAA-GFDL/GFDL-ESM4, INM/INM-CM5-0, CMCC/CMCC-ESM2]
# Select projection experiments. Input: list of catalog SSP identifiers.
scenarios: [ssp245, ssp585]

# Ensemble member labels, in order of preference. A label a model does not
# have is skipped; four labels reach nearly every model.
# Choose ensemble members by availability. Input: mapping.
members:
  # Rank preferred ensemble member labels. Input: ordered list of rXiXpXfX labels.
  preference: [r1i1p1f1, r1i1p1f2, r1i1p1f3, r1i1p2f1]
  # Select one or all available preferred members. Options: first_available | all.
  #selection: first_available
  # Override member selection for individual models. Input: model-to-member mapping.
  #overrides: {}


# -----------------------------------------------------------------------------
#  VARIABLES
# -----------------------------------------------------------------------------

# Built-ins: precip (relative % change), temp (absolute degC change), pet, tdew, wind.
# Select projection variables. Input: list of variable names.
variables: [precip, temp]
# Per-variable settings; built-ins need none, a custom variable needs all four of
# source, canonical, units and change (see the analyze_projections reference).
# Configure individual variables. Input: variable-to-settings mapping.
#variable_options:
  # Optional native-cell PET from monthly CMIP6 means; needs tas, ps and rsds (debruin also rsdt).
  # Configure projected PET. Input: {method: makkink | debruin, change: relative | absolute}.
#  pet: {method: makkink}
  # Configure projected dew point. Input: {method: specific_humidity}.
#  tdew: {method: specific_humidity}
  # Configure projected wind speed. Input: {method: sfcwind | components}.
#  wind: {method: sfcwind}
  # A built-in with a full declaration, as the bundled test cases write it.
  # Declare precipitation explicitly. Input: {source, canonical, units, change}.
#  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  # Define a custom projection variable; list it in variables too. Input: mapping.
#  'custom_variable':
    # Select the catalog's renamed variable. Input: post-rename variable name, such as temp.
#    source: temp
    # Specify the physical quantity type. Options: rate | state.
#    canonical: state
    # Set canonical measurement units. Input: supported unit string.
#    units: degC
    # Choose change calculation convention. Options: relative | absolute.
#    change: absolute


# -----------------------------------------------------------------------------
#  WINDOWS
# -----------------------------------------------------------------------------

# Calendar years, inclusive; 30 years are recommended. Omitted, it is climate.window.
# CMIP6 historical runs end in 2014, so a later end is cut back to 2014 with a notice.
# Select historical reference calendar years. Input: inclusive year mapping.
reference_period:
  # First historical reference calendar year. Input: integer year, <= end.
  start: 1985
  # Last historical reference calendar year. Input: integer year; clipped to 2014.
  end: 2014

# Future horizons, keyed by the label used in outputs.
# Select future projection horizons. Input: mapping of labels to inclusive year mappings.
future_periods:
  # Define one future horizon. Input: inclusive year mapping.
  mid:
    # First future horizon calendar year. Input: integer year, <= end.
    start: 2030
    # Last future horizon calendar year. Input: integer year, >= start.
    end: 2060
  # Define one future horizon. Input: inclusive year mapping.
  far:
    # First future horizon calendar year. Input: integer year, <= end.
    start: 2070
    # Last future horizon calendar year. Input: integer year, >= start.
    end: 2100


# -----------------------------------------------------------------------------
#  REPORTING
# -----------------------------------------------------------------------------

# Select ensemble statistics to report. Input: list of supported statistic names.
#stats: [mean, median, std]

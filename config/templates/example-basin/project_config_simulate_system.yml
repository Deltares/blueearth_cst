# =============================================================================
#  simulate_system (wf4) -- simulations and indicators from a ready collection
# =============================================================================
#
# Runs the model on a ready climate collection and reduces its responses.
# The routine collection selection comes from the project generation plan. Keep this
# next to the project file.


# -----------------------------------------------------------------------------
#  EXPERIMENT
# -----------------------------------------------------------------------------

# Default family: stress_test, initially stress_test_01. Plain reruns retain the
# highest allocated number; --new-experiment creates the next one. A custom base
# selects its own numbered family; an exact numbered name pins that experiment.
# Select experiment family or exact experiment. Input: name string.
#experiment_name: my_experiment

# What to run, in any order: simulations, indicators, or both (the default).
# Indicators alone read the retained responses and never start Wflow.
# Select simulation and indicator operations. Input: list containing simulations and/or indicators.
operations: [simulations, indicators]

# Include each realization's unperturbed member in WF4 (default: true).
# False skips its forcing preparation and simulation; WF3 retains it for ancestry.
# Indicators needing unperturbed reference runs require true.
# Run each realization's unperturbed reference member. Options: true | false.
include_unperturbed: true

# With named climate.forcings: the historical recipe whose model TOML, end
# state and Qcrit discharge this experiment uses. It must be one WF1 ran, and
# the collection must match its extraction; delta collections allow only default.
# Select the historical recipe. Input: default or a climate.forcings name.
#historical_forcing: default

# How each run's stores start. auto uses a warm state configured in the model
# TOML, otherwise WF1's historical end state (run_default/outstate, or
# run_<id>/outstate for a named recipe); historical
# requires that end state; cold starts from Wflow's cold initialization.
# Warm-up years repeat the run's first days before its window and are
# discarded, so responses keep the configured calendar.
# Choose initial model states and discarded warm-up. Input: mapping.
initialization:
  # Select the initial state source. Options: auto | historical | cold.
  state: auto
  # Discard years simulated before the window. Input: nonnegative integer.
  warmup_years: 1


# -----------------------------------------------------------------------------
#  INDICATOR SETS
# -----------------------------------------------------------------------------

# Named sets, each published to results/indicator_sets/<set-id>/ with an
# indicators.csv dictionary. `default` is bundled; omitted means [default].
# Add eflow-erfa for 70 discharge median/IQR indicators: [default, eflow-erfa].
# Crop-water also needs retained P, PET, AET, recharge and Q. Configure it inline:
#indicator_sets:
#  - set: crop-water
#    'summer_low_flow_days':
#      thresholds:
#        baseline_quantile: {}
#    'summer_longest_dry_spell':
#      dry_day_mm: 2.0
#    'winter_longest_dry_spell':
#      enabled: false
#  - set: flow_regime
#    'q_mean_annual_90day_min':
#      enabled: false
# Omitted indicators/parameters inherit defaults. enabled defaults to true.
# Historical Qcrit uses this project's WF1 model; omitted years (or all)
# uses all historical calendar years. Q90 exceedance, summer and linear are defaults.
# Preparation follows WF1 at the WF4 boundary; a combined dry-run may leave it pending.
# See blueearth_cst/indicators/sets/crop_water/README.md for the complete rule.
# Select named indicator sets to calculate. Input: list of IDs or inline mappings.
indicator_sets:
  # Select the registered indicator set. Input: installed set ID.
  - set: default

# Custom sets: set id -> file. A relative config_path resolves against THIS
# file; absolute paths are allowed. Copy config/templates/indicator_set.template.yml.
# An explicit file may replace a bundled set other than `default`.
# Register custom indicator set definitions. Input: set-ID-to-definition mapping.
#indicator_set_definitions:
# Define a custom indicator set. Input: configuration path mapping.
#  'example_subset':
# Locate the indicator set definition. Input: YAML path relative to this file or absolute.
#    config_path: indicator_sets/example_subset.yml

# Calculate part of a selected set; omitted means all of its indicators.
# Narrow selected sets to individual indicators. Input: set-ID-to-choice mapping.
#indicator_selection:
# Keep or drop named indicators of one set. Input: {include: [...]} or {exclude: [...]}.
#  'crop-water':
# Drop indicators by published name. Input: nonempty list of indicator names.
#    exclude: [summer_low_flow_days]

# partial (default) publishes an indicator lacking an input or enough data as
# unavailable, with a warning; strict refuses the set instead.
# Choose how unavailable indicators are handled. Options: partial | strict.
#indicator_evaluation: partial

# -----------------------------------------------------------------------------
#  COMPUTE
# -----------------------------------------------------------------------------

# How model runs are grouped. Left unset, the toolbox picks by basin size
# (advanced_settings `batching`); `scripts/calibrate_batching.py` measures
# your own basin and machine and prints the values to put here.
# Override automatic simulation resource allocation. Input: mapping.
#compute:
# Julia threads assigned to each batch. Input: positive integer.
#  julia_threads: 1
# Limit concurrently running simulation batches. Input: positive integer.
#  max_parallel_batches: 2
# Cap simulation runs per batch. Input: positive integer.
#  batch_size_max: 8
# Fix batch size instead of automatic sizing. Input: positive integer.
#  batch_size: 4
# Reserve free disk space during simulations. Input: nonnegative gigabytes.
#  disk_headroom_gb: 40

# Optional native grids for every selected run; may require substantial disk space.
# Independent of historical model output. Omitted/null disables grids.
# Retained model output settings. Input: mapping.
output:
  # Retained scalar time series; indicators use these values. Input: mapping.
  csv:
    # Decimal places kept in retained CSV values. Input: integer 0–15.
    decimal_places: 5
#  netcdf_grid:
#    compressionlevel: 1
#    variables:
#      snowpack_dry_snow__leq_depth: snow
#      snowpack_liquid_water__depth: snowwater

# Path to where the wflow model will be stored (include the project name)
project_name: Gabon
project_dir: test_case/gabon

# Path to the data catalog to use (can be different for Linux/Windows/data stored on P drive or other)
data_sources: config/catalogs/archive/deltares_data_analyze_projections_linux.yml

# climate models and scenarios
clim_project: isimip3
models: [gfdl]
scenarios: [ssp370]
members: [r1i1p1f1]

variables:

  precip: {source: precip, canonical: rate, units: mm/day, change: relative}

  temp: {source: temp, canonical: state, units: degC, change: absolute}
# time horizons
start_month_hyd_year: Oct
historical: 1991-01-01, 2014-12-31
future_horizons: 
  near: 2021-01-01, 2050-12-31
  far: 2071-01-01, 2100-12-31

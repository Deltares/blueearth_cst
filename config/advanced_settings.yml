# Advanced settings: toolbox-wide values a normal project never touches.
#
# Read once by blueearth_cst/shared/advanced_settings.py for every project and
# workflow; never passed as --configfile. Editing it changes the toolbox, not a run.
#
#   constraints  hard limits no project config can relax
#   defaults     starting values; each comment names the project key that overrides it
#   runtime      toolchain settings that must match the run environment
#   batching     WF4 batched Wflow runs
#
# Unknown sections and keys are rejected. To add a key, extend
# `_ADVANCED_SETTINGS_SCHEMA` and tests/test_advanced_settings.py with it.
# Spatial-foundation guidance: dev/reference/toolbox-spatial-foundation.md.

constraints:

  # Minimum historical record in calendar years: weathergenr's wavelet analysis
  # needs this many annual values. Checked on the requested climate.window and on
  # the span the staged source delivers.
  min_historical_years: 16

  # Flagged (near-dry) months above which WF2's monthly relative change for a
  # combination is reported as undefined rather than caveated.
  max_flagged_months: 3

defaults:

  # Share of free disk WF4's batched Wflow runs may hold in temporary forcing
  # files at peak; only ever lowers the batch size. A project sets an absolute
  # budget instead with simulate_system `compute.disk_headroom_gb`.
  batch_disk_headroom_fraction: 0.25

  # Seed for weather generation and perturbation. A project overrides it with
  # generate_scenarios `seed:` (an integer, or `auto`). Changing it invalidates
  # the recorded baseline.
  seed: 123

  # First month of the water year. Override: climate.water_year_start.
  # A non-Jan value moves annual values and invalidates a Jan baseline.
  water_year_start: Jan

  # Catalog entries for model-free basin delineation, a matching pair. Override:
  # basin.sources.hydrography and basin.sources.basin_index.
  hydrography: merit_hydro_ihu
  basin_index: merit_hydro_index

  # Automatic subbasins per basin (11 keeps one basin's map legible); the hard
  # cap is 99. Override: basin.delineation.max_subbasins.
  max_subbasins: 11

  # Largest distance a gauge is moved onto the derived river network, metres.
  # Override: basin.delineation.snap_tolerance_m.
  snap_tolerance_m: 10000.0

  # Spell-length multiplier when a project sets none: one value for every month or
  # 12 (Jan-Dec); 1.0 = no adjustment. Override: generate_scenarios
  # climate_perturbations.spell_factors.dry / .wet.
  spell_factor: 1.0

  # WF2 change-factor statistics: xarray reduction names or q_<percentile>.
  # Override: analyze_projections `stats`.
  change_factor_stats: [mean, median, std]

runtime:

  # Wflow.jl --threads for WF1's historical run; WF4 uses `batching` below.
  # Part of the recorded performance baseline (-c 3, --threads 4, B=1).
  historical_julia_threads: 4

  # juliaup selector (`julia +<version>`), a quoted three-part string. Must match
  # pixi.toml's install-julia task and Manifest.toml (tests/test_julia_runtime.py).
  julia_version: "1.11.7"

batching:

  # WF4 batches: threads per batch, batches at once, chosen by the model's active
  # cell count when `auto`. Only the small regime is measured (257 cells, 12 CPUs);
  # calibrate with scripts/calibrate_batching.py. A project overrides per run with
  # simulate_system compute.julia_threads / compute.max_parallel_batches.
  threads: auto
  max_parallel: auto
  small_basin_cells: 5000
  small_threads: 1
  small_max_parallel: 2
  large_threads: 4
  large_max_parallel: 1

  # Per-batch memory estimate that caps batches at once to 80% of available memory;
  # 1.3 GB measured on the baseline basin, the per-cell term is provisional.
  memory_per_batch_gb: 1.5
  memory_per_cell_kb: 20.0

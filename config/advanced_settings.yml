# Advanced settings — toolbox-wide knobs a normal project never touches.
#
# NOT a `--configfile` target. The three Snakefiles are driven by a project's
# own `snake_config_*.yml` (the shipped examples live beside the project they
# write into, under `test_case/`); THIS file is read
# once by `blueearth_cst/shared/snake_utils.py` and applies to every project
# and every workflow. Editing it changes the toolbox, not a run.
#
# Three sections, and the split is the point:
#
#   constraints/ — hard limits. No project config can relax one; a value that
#                  violates a constraint is rejected before any rule executes.
#                  Change one only with a reason you would write down.
#   defaults/    — starting values a project config MAY override. The key that
#                  overrides each one is named in its comment.
#   runtime/     — external toolchain pins. Not limits and not overridable:
#                  they must match the environment the workflows actually run
#                  in, so changing one here without changing it there breaks
#                  the run rather than tuning it.
#
# Unknown sections and unknown keys are REJECTED, so a typo fails loudly at
# parse time rather than silently keeping the built-in value.
#
# Adding a setting: put it in the right section here, add it to the schema in
# `snake_utils._ADVANCED_SETTINGS_SCHEMA`, and give it a test in
# `tests/test_advanced_settings.py`. The schema is what makes the rejection
# above possible, so the two must stay in step.

constraints:

  # Minimum historical window, in whole calendar years.
  #
  # Set by the most demanding consumer: weathergenr's wavelet decomposition
  # needs at least this many ANNUAL observations (`wavelet_cwt.R`), so a
  # shorter observed record cannot support a climate stress test — and a
  # project that cannot support one is misconfigured for what this toolbox is
  # for, whatever workflow happens to be running.
  #
  # Enforced in two places, against two different facts: the window a config
  # REQUESTS (workflow 1, at parse time) and the span the staged source
  # ACTUALLY delivers (the shared climate-store producer, so workflows 2 and 3
  # too). Lowering it does not make weathergenr work on less data; it only
  # moves the failure later and makes it harder to read.
  min_historical_years: 16

defaults:

  # Wflow.jl `--threads`. Overridable per project via `shared.julia_threads`.
  #
  # Wflow parallelizes over grid CELLS, so raising this pays on a large basin
  # and does nothing on a small one. It is NOT Snakemake's `--cores`: the two
  # multiply, so keep `--cores N x julia_threads <= logical CPUs`.
  #
  # 4 is one leg of the frozen resource triple `(-c 3, --threads 4, B=1)` that
  # every recorded performance baseline was measured at
  # (dev/milestones/p33/performance-baseline.md §5.6). Changing it here silently
  # invalidates those comparisons — prefer the per-project override.
  julia_threads: 4

  # Randomization seed for every stochastic step. Overridable per project via
  # `shared.seed`, which also accepts `auto`.
  #
  # Today there is exactly ONE consumer: weathergenr, which uses it for both
  # realization generation and the perturbation step (C34/F15 — one seed, so
  # the two halves of an experiment cannot have different reproducibility
  # guarantees). It lives here rather than in the weather generator's own
  # config so that a second stochastic step, in any workflow, reads the same
  # key instead of introducing a second seed that can drift from this one.
  #
  # `shared.seed: auto` derives the seed from the experiment name, so it
  # differs between experiments and is identical on every re-run of one. A
  # seed that changed per INVOCATION would rewrite rule 3.10's output every
  # time and re-run all of WF3 — the same trap
  # `resolve_default_experiment_name` documents for dated experiment names.
  #
  # Keep this numeric. `dev/baseline/manifest.json` is recorded from a run
  # that used it, so changing it here invalidates every baseline comparison;
  # prefer the per-project override, exactly as for julia_threads above.
  seed: 123

  # First month of the water (hydrological) year, as a three-letter name.
  # Overridable per project via `shared.water_year_start`.
  #
  # Every workflow that reduces to an ANNUAL value reads it: WF2's change
  # factors, WF3's weather generation, WF3's hydrological indicators and WF1's
  # climate figures. It is one key because these are one physical idea — before
  # 2026-08-12 they were four independent behaviours that agreed only by
  # accident, and two of them could not be configured at all.
  #
  # `Jan` is the calendar year and is what every recorded result used, so it is
  # value-neutral: a January water year ends in December, which is exactly the
  # aggregation the code did before. A non-Jan value MOVES annual extremes, by
  # design — that is the point of a water year for a basin whose flood season
  # crosses New Year — and therefore invalidates a baseline recorded under Jan.
  water_year_start: Jan

runtime:

  # The juliaup version selector every workflow Julia invocation carries
  # (`julia +<version> ...`). Julia is deliberately NOT in the pixi env —
  # conda-forge has no win-64 build — so it is juliaup-managed, must already be
  # on PATH, and the `+` prefix is how the shim picks a toolchain. Install it
  # with `juliaup add <version>`.
  #
  # THREE files declare this version and they must agree. This one is the
  # human-facing declaration and the only one the workflows read; the other two
  # cannot read YAML, so equality is enforced by
  # `tests/test_julia_runtime.py` rather than by single-sourcing:
  #
  #   pixi.toml        `install-julia` task — instantiates the Julia env.
  #                    Hand-edit it to match.
  #   Manifest.toml    `julia_version` — machine-generated, records what the
  #                    lock was actually resolved against. Do not hand-edit;
  #                    re-run `pixi run install-julia` to regenerate.
  #
  # `Project.toml`'s `julia = "~1.11"` compat bound is deliberately looser (a
  # range; it documents why 1.12.x is excluded). It is only checked for shape
  # and for admitting this pin — the tilde is what does the excluding.
  #
  # Must be a QUOTED three-part string. Unquoted `1.11` is a YAML float, and a
  # two-part selector lets juliaup resolve a different patch than the manifest
  # was built against.
  julia_version: "1.11.7"
